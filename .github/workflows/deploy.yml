name: Deploy Pinguim Ice Admin to Oracle VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Prepare build artifact
        run: tar -czf pinguimice-admin.tar.gz dist

      - name: Decode and save SSH key
        run: |
          echo "${{ secrets.OCI_VM_SSH_KEY }}" | base64 -d > ${{ github.workspace }}/key.pem
          chmod 600 ${{ github.workspace }}/key.pem

      - name: Upload build to VM
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ vars.OCI_FRONTEND_VM_HOST }}
          username: ${{ vars.OCI_VM_SSH_USER }}
          key_path: ${{ github.workspace }}/key.pem
          source: pinguimice-admin.tar.gz
          target: /home/${{ vars.OCI_VM_SSH_USER }}

      - name: Deploy build on VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.OCI_FRONTEND_VM_HOST }}
          username: ${{ vars.OCI_VM_SSH_USER }}
          key_path: ${{ github.workspace }}/key.pem
          script: |
            set -e
            cd /home/${{ vars.OCI_VM_SSH_USER }}

            echo "Removing old site..."
            sudo rm -rf /var/www/pinguimice-admin
            sudo mkdir -p /var/www/pinguimice-admin

            echo "Extracting new build..."
            sudo tar -xzf pinguimice-admin.tar.gz -C /var/www/pinguimice-admin --strip-components=1
            sudo chown -R www-data:www-data /var/www/pinguimice-admin

            echo "STEP 1: Creating temporary HTTP-only config..."
            sudo tee /etc/nginx/sites-available/pinguimice-admin > /dev/null <<EOF
            server {
              listen 80;
              server_name admin.pinguimice.com.br;
                
              root /var/www/pinguimice-admin;
              index index.html;
                
              location / {
                try_files \$uri \$uri/ /index.html;
              }

              location /api/ {
                proxy_pass https://api.primeira.app.br/api/;
                proxy_set_header Host api.primeira.app.br;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }
            EOF
            
            echo "Enabling site..."
            sudo ln -sf /etc/nginx/sites-available/pinguimice-admin /etc/nginx/sites-enabled/pinguimice-admin
            
            echo "Reloading nginx (HTTP only)..."
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "STEP 2: Generating SSL certificate..."
            sudo certbot --nginx -n --agree-tos --redirect \
            --email diegovaille@gmail.com \
            -d admin.pinguimice.com.br
            
            echo "STEP 3: Adding full HTTPS config..."
            sudo tee /etc/nginx/sites-available/pinguimice-admin > /dev/null <<EOF
            server {
              listen 80;
              server_name admin.pinguimice.com.br;
              return 301 https://\$host\$request_uri;
            }
              
            server {
              listen 443 ssl;
              server_name admin.pinguimice.com.br;
              
              ssl_certificate /etc/letsencrypt/live/admin.pinguimice.com.br/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/admin.pinguimice.com.br/privkey.pem;
              
              root /var/www/pinguimice-admin;
              index index.html;
              
              include snippets/hardening.conf;

              location ~* \.(js|css)$ {
                add_header Cache-Control "public, max-age=86400";
                try_files \$uri =404;
              }
              
              location ~* \.html$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                try_files \$uri =404;
              }
              
              location / {
                try_files \$uri \$uri/ /index.html;
              }

              location /api/ {
                proxy_pass https://api.primeira.app.br/api/;
                proxy_set_header Host api.primeira.app.br;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }
            EOF
            
            echo "Aplicando hardening do nginx (rate limit + bloqueio de probes)..."
            sudo tee /etc/nginx/conf.d/hardening.conf > /dev/null <<'HARDENING_EOF'
            limit_req_zone $binary_remote_addr zone=front_limit:10m rate=30r/s;
            limit_req_status 429;
            map $request_uri $bad_request_uri {
                default 0;
                ~*(?:\.env|\.git|\.svn|\.hg|/\.aws|/\.ssh|/\.vscode|/\.idea)   1;
                ~*(?:wp-admin|wp-login|wp-includes|wp-content|xmlrpc\.php)     1;
                ~*(?:phpunit|eval-stdin|allow_url_include|auto_prepend_file)   1;
                ~*(?:/vendor/|/cgi-bin/|luci|/SDK/webLanguage|adminer)         1;
                ~*\.(?:php|asp|aspx|jsp|cgi|env)(?:$|[?/])                     1;
            }
            HARDENING_EOF
            sudo mkdir -p /etc/nginx/snippets
            sudo tee /etc/nginx/snippets/hardening.conf > /dev/null <<'SNIPPET_EOF'
            if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) { return 444; }
            if ($bad_request_uri) { return 444; }
            limit_req zone=front_limit burst=100 nodelay;
            SNIPPET_EOF

            echo "Reloading nginx with HTTPS enabled..."
            sudo nginx -t && sudo systemctl reload nginx

      - name: Cleanup
        run: rm -f ${{ github.workspace }}/key.pem
