name: Deploy Pinguim Ice Admin to Oracle VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    uses: diegovaille/deploy-templates/.github/workflows/deploy-static.yml@v1
    with:
      vm_host: ${{ vars.OCI_FRONTEND_VM_HOST }}
      ssh_user: ${{ vars.OCI_VM_SSH_USER }}
      domains: "admin.pinguimice.com.br"
      remote_path: /var/www/pinguimice-admin
      site_name: pinguimice-admin
      nginx_config_path: deploy/nginx.conf
    secrets: inherit
