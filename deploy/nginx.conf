server {
    listen 80;
    server_name admin.pinguimice.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.pinguimice.com.br;

    ssl_certificate /etc/letsencrypt/live/admin.pinguimice.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.pinguimice.com.br/privkey.pem;

    root /var/www/pinguimice-admin;
    index index.html;

    include snippets/hardening.conf;

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://api.primeira.app.br/api/;
        proxy_set_header Host api.primeira.app.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
